[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "remixaudio"
version = "1.0.0"
description = "音频混音 & 视频音频合成（pydub + ffmpeg）"
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
authors = [{ name = "siwpan" }]
keywords = ["audio", "mixing", "remix", "ffmpeg", "pydub", "video"]
dependencies = ["pydub", "audioop-lts", "numpy"]

[project.urls]
Homepage = "https://gitee.com/siwpan/remix"
Repository = "https://gitee.com/siwpan/remix"
Changelog = "https://gitee.com/siwpan/remix/blob/master/CHANGELOG.md"

[project.scripts]
remixaudio = "remixaudio.main:main"

[tool.setuptools]
package-dir = { "remixaudio" = ".", "remixaudio.core" = "core", "remixaudio.gui" = "gui" }
packages = ["remixaudio", "remixaudio.core", "remixaudio.gui", "remixaudio.utils"]
